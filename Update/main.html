<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link href="./dist/output.css" rel="stylesheet">
    <title>Update</title>
    <style>


        /* Keyframe animation for the blinking dots */
        @keyframes blink {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }

        /* Apply animation to dots */
        .dots {
            animation: blink 1.5s infinite;
        }

        /* Style for the image */
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        /* Style for the text */
        .text {
            font-size: 1.5rem;
            text-align: center;
        }

    </style>
</head>
<body class="font-host-grotesk bg-black text-white font-bold h-screen flex items-center justify-center">
    <div class="flex flex-col items-center">
        <!-- Image (logo) -->
        <img src="./src/M2.png" class="logo">

        <!-- Text with animated dots -->
        <h1 class="text text-3xl mt-4">Checking For Update<span class="dots"> ...</span></h1>
    </div>


    <script src="update.js"></script>


</body>
</html>
